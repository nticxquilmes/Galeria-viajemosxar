<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Promociones</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #f2f2f2;
    font-family: Arial, sans-serif;
}

.carousel {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

.slides {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.5s ease-in-out;
}

.slide {
    flex: 0 0 100%;
    min-width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}

.slide img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
}

/* BOTONES */

button {
    position: absolute;
    top: 50%;
    z-index: 10;

    transform: translateY(-50%);

    width: 48px;
    height: 58px;

    border: none;
    border-radius: 8px;

    background: rgba(0,0,0,0.45);
    color: white;

    font-size: 34px;
    line-height: 1;
}

.prev {
    left: 10px;
}

.next {
    right: 10px;
}

/* CONTADOR */

.counter {
    position: absolute;
    z-index: 10;

    bottom: 15px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(0,0,0,0.55);
    color: white;

    padding: 6px 12px;

    border-radius: 15px;

    font-size: 14px;
}

</style>
</head>

<body>

<div class="carousel">

    <div class="slides" id="slides">

        <div class="slide">
            <img src="0.jpg">
        </div>

        <div class="slide">
            <img src="1.jpg">
        </div>

        <div class="slide">
            <img src="2.jpg">
        </div>

        <div class="slide">
            <img src="3.jpg">
        </div>

        <div class="slide">
            <img src="4.jpg">
        </div>

<div class="slide">
            <img src="5.jpg">
        </div>

        <div class="slide">
            <img src="6.jpg">
        </div>

<div class="slide">
            <img src="7.jpg">
        </div>

        <div class="slide">
            <img src="8.jpg">
        </div>

        
    </div>

    <button class="prev">‹</button>
    <button class="next">›</button>

    <div class="counter" id="counter">
        1 / 9
    </div>

</div>

<script>

let current = 0;
const total = 9;

const slides = document.getElementById("slides");
const counter = document.getElementById("counter");

const botonAnterior = document.querySelector(".prev");
const botonSiguiente = document.querySelector(".next");


function showSlide() {

    slides.style.transform =
        "translateX(-" + (current * 100) + "%)";

    counter.textContent =
        (current + 1) + " / " + total;
}


/* BOTÓN SIGUIENTE */

botonSiguiente.addEventListener("click", function() {

    current++;

    if (current >= total) {
        current = 0;
    }

    showSlide();

});


/* BOTÓN ANTERIOR */

botonAnterior.addEventListener("click", function() {

    current--;

    if (current < 0) {
        current = total - 1;
    }

    showSlide();

});


/* DESLIZAMIENTO CON EL DEDO */

let startX = 0;

slides.addEventListener("touchstart", function(e) {

    startX = e.touches[0].clientX;

});


slides.addEventListener("touchend", function(e) {

    let endX = e.changedTouches[0].clientX;

    let diferencia = startX - endX;


    if (diferencia > 50) {

        current++;

        if (current >= total) {
            current = 0;
        }

        showSlide();
    }


    if (diferencia < -50) {

        current--;

        if (current < 0) {
            current = total - 1;
        }

        showSlide();
    }

});


/* POSICIÓN INICIAL */

showSlide();

</script>
</body>
</html>
