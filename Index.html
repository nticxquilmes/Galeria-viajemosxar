<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Promociones</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f2f2f2;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.carousel {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

.slides {
    display: flex;
    height: 100%;
    transition: transform 0.35s ease;
}

.slide {
    min-width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}

.slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: rgba(0,0,0,0.45);
    color: white;
    font-size: 30px;
    width: 45px;
    height: 55px;
    border-radius: 8px;
}

.prev {
    left: 10px;
}

.next {
    right: 10px;
}

.counter {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    color: white;
    padding: 6px 12px;
    border-radius: 15px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="carousel">

    <div class="slides" id="slides">

        <div class="slide">
            <img src="0.jpg">
        </div>

        <div class="slide">
            <img src="1.jpg">
        </div>

        <div class="slide">
            <img src="2.jpg">
        </div>

        <div class="slide">
            <img src="3.jpg">
        </div>

        <div class="slide">
            <img src="4.jpg">
        </div>

<div class="slide">
            <img src="5.jpg">
        </div>

        <div class="slide">
            <img src="6.jpg">
        </div>

<div class="slide">
            <img src="7.jpg">
        </div>

        <div class="slide">
            <img src="8.jpg">
        </div>

        
    </div>

    <button class="prev" onclick="previous()">‹</button>
    <button class="next" onclick="next()">›</button>

    <div class="counter" id="counter">
        1 / 3
    </div>

</div>

<script>

let current = 0;

const slides = document.getElementById("slides");
const counter = document.getElementById("counter");

function showSlide() {

    slides.style.transform =
        "translateX(-" + (current * 100) + "%)";

    counter.textContent =
        (current + 1) + " / 3";
}

function next() {

    if (current < 2) {
        current++;
        showSlide();
    }
}

function previous() {

    if (current > 0) {
        current--;
        showSlide();
    }
}


/* Deslizamiento con el dedo */

let startX = 0;

slides.addEventListener("touchstart", function(e) {
    startX = e.touches[0].clientX;
});

slides.addEventListener("touchend", function(e) {

    let endX = e.changedTouches[0].clientX;

    if (startX - endX > 50) {
        next();
    }

    if (endX - startX > 50) {
        previous();
    }

});

</script>

</body>
</html>
